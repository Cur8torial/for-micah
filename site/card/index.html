<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A card for Micah Bielert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&family=EB+Garamond:ital@0;1&family=Josefin+Sans:wght@400;600&display=swap">
<style>
  /* Four cards to a US Letter sheet, to cut apart and set out at a gathering. The QR code opens the memorial. */
  @page { size: letter; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #1b1a18; color: #e4dfd7; font-family: "EB Garamond", Georgia, serif; }
  .how { max-width: 8.5in; margin: 0 auto; padding: 28px 20px 18px; text-align: center; font-size: 19px; line-height: 1.5; }
  .how p { margin: 0 0 14px; color: #a39c90; }
  .how a { color: #e4dfd7; }
  .how button { min-height: 50px; padding: 0 26px; background: #ece9e6; color: #1f1d1a; border: 0; cursor: pointer; font: 600 13px/1 "Josefin Sans", system-ui, sans-serif; letter-spacing: 0.16em; text-transform: uppercase; }
  .sheet { width: 8.5in; height: 11in; margin: 0 auto 40px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; background: #fff; transform-origin: top center; }
  .card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0.35in 0.3in; text-align: center; color: #1f1d1a; border: 0.5px dashed #c9c2b6; }
  .card img.portrait { width: 1.45in; height: 1.8in; object-fit: cover; filter: grayscale(1) contrast(1.05); border: 1px solid #1f1d1a; padding: 3px; }
  .card .mem { margin: 0 0 0.12in; font: 400 8pt/1 "Josefin Sans", sans-serif; letter-spacing: 0.3em; text-transform: uppercase; color: #6b645a; }
  .card h1 { margin: 0.14in 0 0; font: italic 500 22pt/1.1 "Playfair Display", Georgia, serif; }
  .card .yrs { margin: 0.06in 0 0; font: 400 8pt/1.3 "Josefin Sans", sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: #3d3934; }
  .card .qr { width: 1.2in; height: 1.2in; image-rendering: pixelated; margin-top: 0.16in; }
  .card .scan { margin: 0.08in 0 0; max-width: 2.9in; font: italic 11pt/1.3 "EB Garamond", Georgia, serif; color: #3d3934; }
  .card .url { margin: 0.04in 0 0; font: 400 7.5pt/1 "Josefin Sans", sans-serif; letter-spacing: 0.08em; color: #6b645a; }
  @media screen and (max-width: 8.8in) { .sheet { transform: scale(calc(100vw / 8.7in)); margin-bottom: calc(-11in * (1 - 100vw / 8.7in) + 40px); } }
  @media print { body { background: #fff; } .how { display: none; } .sheet { margin: 0; transform: none; } }
</style>
</head>
<body>
<div class="how">
  <p>Print this page on a sheet of US Letter paper at full size. It makes four cards; cut along the dashed lines.<br>The code on each card opens <a href="/">Micah’s page</a> on any phone camera.</p>
  <button type="button" onclick="window.print()">Print the cards</button>
</div>
<div class="sheet" id="sheet"></div>
<template id="one">
  <div class="card">
    <p class="mem">In memoriam</p>
    <img class="portrait" src="../photos/76.jpg" alt="Micah Bielert">
    <h1>Micah Bielert</h1>
    <p class="yrs">June 28, 1986 – March 8, 2025</p>
    <img class="qr" src="qr.png" alt="QR code for micah-bielert.netlify.app">
    <p class="scan">Scan to see his photos, read his words, and sign the guestbook.</p>
    <p class="url">micah-bielert.netlify.app</p>
  </div>
</template>
<script>
  var t = document.getElementById('one'), sheet = document.getElementById('sheet');
  for (var i = 0; i < 4; i++) sheet.appendChild(t.content.firstElementChild.cloneNode(true));
</script>
</body>
</html>
