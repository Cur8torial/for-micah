<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/book/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta property="og:title" content="I’ve Gripped the Phantom">
<meta property="og:description" content="A collection of social posts as written by Micah Bielert, 1986–2025.">
<meta property="og:image" content="https://micah-bielert.netlify.app/book/pages/02.jpg">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>I've Gripped the Phantom</title>
<meta name="description" content="A collection of social posts as written by Micah Bielert, June 28, 1986 – March 8, 2025.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&family=Josefin+Sans:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #1b1a18;
    --ground-2: #252320;
    --paper: #ece9e6;
    --ink: #e4dfd7;
    --muted: #a39c90;
    --line: #3a3732;
    --focus: #d8cdb8;
    --display: "Playfair Display", "Times New Roman", serif;
    --ui: "Josefin Sans", "Futura", "Century Gothic", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--ui); font-size: 15px;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .top {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    padding: 14px 20px 6px; flex-wrap: wrap;
  }
  .top h1 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 20px; letter-spacing: .01em; }
  .top h1 .home { color: var(--muted); text-decoration: none; } .top h1 .home:hover { color: var(--ink); }
  .top h1 span { color: var(--line); margin: 0 .2em; }
  .top p { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }

  .stage {
    flex: 1; min-height: 0; position: relative; display: grid; place-items: center;
    padding: 8px 16px; perspective: 2400px;
  }
  .frame { position: relative; width: min(100%, calc((100dvh - 150px) * 1.2941)); aspect-ratio: 1800 / 1391; max-width: 100%; }
  .frame img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 18px 40px -12px rgba(0,0,0,.7);
    transform-origin: left center; backface-visibility: hidden; user-select: none; -webkit-user-drag: none;
  }
  .frame img.under { z-index: 0; }
  .frame img.cur { z-index: 1; }
  .frame img.turning { z-index: 2; transition: transform .7s cubic-bezier(.3,.1,.25,1), filter .7s; }
  .frame img.away { transform: rotateY(-105deg); filter: brightness(.7); }
  .frame img.fade { transition: opacity .35s ease; }
  .hit { position: absolute; top: 0; bottom: 0; width: 35%; z-index: 3; background: none; border: 0; cursor: pointer; }
  .hit.prev { left: 0; cursor: w-resize; } .hit.next { right: 0; cursor: e-resize; }
  .hit:focus-visible { outline: 2px solid var(--focus); outline-offset: -4px; }

  .bar {
    display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .bar button, .bar a {
    font: 600 13px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
    background: none; border: 1px solid var(--line); border-radius: 999px; min-height: 44px; padding: 0 18px;
    display: inline-flex; align-items: center; cursor: pointer; text-decoration: none;
  }
  .bar button:hover, .bar a:hover { border-color: var(--muted); }
  .bar button:focus-visible, .bar a:focus-visible, .grid a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .bar button:disabled { opacity: .35; cursor: default; }
  .count { min-width: 84px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .08em; padding-top: 3px; }

  .grid-view { position: fixed; inset: 0; z-index: 10; background: var(--ground); overflow-y: auto; padding: 20px 16px 40px; }
  .grid-head { max-width: 1200px; margin: 0 auto 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .grid-head h2 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 22px; }
  .grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .grid a { display: grid; gap: 6px; color: var(--muted); text-decoration: none; font-size: 12px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .grid img { width: 100%; aspect-ratio: 360 / 278; object-fit: cover; background: var(--ground-2); display: block; }
  .grid a.on img { outline: 2px solid var(--focus); outline-offset: 2px; }

  @media (max-width: 560px) {
    .top { padding-inline: 16px; }
    .top p { font-size: 11.5px; }
    .bar button, .bar a { padding: 0 14px; }
    .frame { width: 100%; }
  }
  .hint { display: none; text-align: center; color: var(--muted); font-size: 13px; letter-spacing: .04em; margin: 0; padding: 0 16px 4px; }
  @media (max-width: 560px) and (orientation: portrait) { .hint { display: block; } }
  @media (prefers-reduced-motion: reduce) { .frame img.turning { transition: none; } }
</style>

</head>
<body>
<header class="top">
  <h1><a class="home" href="/" aria-label="Back to Micah’s page">Micah</a> <span aria-hidden="true">/</span> I’ve Gripped the Phantom</h1>
  <p>Micah Bielert · June 28, 1986 – March 8, 2025</p>
</header>

<main class="stage" id="stage" aria-label="Book">
  <div class="frame" id="frame">
    <img id="a" class="cur" alt="" decoding="async">
    <button class="hit prev" id="hitPrev" aria-label="Previous page"></button>
    <button class="hit next" id="hitNext" aria-label="Next page"></button>
  </div>
</main>

<p class="hint">Turn your phone sideways for bigger pages. Swipe to turn.</p>
<nav class="bar" aria-label="Pages">
  <button id="prev" aria-label="Previous page">Back</button>
  <span class="count" id="count" aria-live="polite">1 / 87</span>
  <button id="next" aria-label="Next page">Next</button>
  <button id="all">All pages</button>
  <button id="fs" hidden>Full screen</button>
  <a id="pdf" href="book.pdf" download="Ive-Gripped-the-Phantom.pdf" hidden>Save the PDF</a>
</nav>

<section class="grid-view" id="gridView" hidden aria-label="All pages">
  <div class="grid-head">
    <h2>All pages</h2>
    <div class="bar" style="padding:0"><button id="closeGrid">Back to the book</button></div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<script>
(function () {
  var N = 87, SHOW_PDF = true;
  var alts = [];
  var i = 0, busy = false;
  var frame = document.getElementById('frame');
  var cur = document.getElementById('a');
  var count = document.getElementById('count');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function src(k) { return 'pages/' + pad(k + 1) + '.jpg'; }
  function alt(k) { return alts[k] || ('Page ' + (k + 1)); }
  function preload(k) { if (k >= 0 && k < N) { var im = new Image(); im.src = src(k); } }

  function show(k, dir) {
    if (k < 0 || k >= N || k === i && cur.getAttribute('src')) return;
    if (busy) return;
    var from = i; i = k;
    count.textContent = (i + 1) + ' / ' + N;
    document.getElementById('prev').disabled = i === 0;
    document.getElementById('next').disabled = i === N - 1;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
    preload(i + 1); preload(i + 2); preload(i - 1);

    if (!cur.getAttribute('src') || !dir) { cur.src = src(i); cur.alt = alt(i); return; }

    busy = true;
    var other = document.createElement('img');
    other.decoding = 'async';
    other.src = src(i); other.alt = alt(i);
    if (reduce.matches) {
      other.className = 'cur fade'; other.style.opacity = '0';
      frame.insertBefore(other, cur.nextSibling);
      requestAnimationFrame(function () { requestAnimationFrame(function () { other.style.opacity = '1'; }); });
      finish(other, 360);
      return;
    }
    if (dir > 0) {
      // the current page lifts at its left edge and turns away, showing the next one beneath
      other.className = 'under';
      frame.insertBefore(other, cur);
      cur.className = 'turning';
      requestAnimationFrame(function () { requestAnimationFrame(function () { cur.classList.add('away'); }); });
    } else {
      // the previous page swings back in over the current one
      other.className = 'turning away';
      frame.insertBefore(other, cur.nextSibling);
      requestAnimationFrame(function () { requestAnimationFrame(function () { other.classList.remove('away'); }); });
    }
    finish(other, 720);
  }

  function finish(next, ms) {
    setTimeout(function () {
      if (cur.parentNode) cur.parentNode.removeChild(cur);
      next.className = 'cur'; next.style.opacity = '';
      next.id = 'a'; cur = next; busy = false;
    }, ms);
  }

  function go(d) { show(i + d, d); }
  document.getElementById('prev').onclick = function () { go(-1); };
  document.getElementById('next').onclick = function () { go(1); };
  document.getElementById('hitPrev').onclick = function () { go(-1); };
  document.getElementById('hitNext').onclick = function () { go(1); };

  document.addEventListener('keydown', function (e) {
    if (!gridView.hidden) { if (e.key === 'Escape') closeGrid(); return; }
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
    else if (e.key === 'Home') show(0, -1);
    else if (e.key === 'End') show(N - 1, 1);
  });

  var sx = null, sy = null;
  frame.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  frame.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  });

  // all pages
  var gridView = document.getElementById('gridView'), grid = document.getElementById('grid');
  function buildGrid() {
    if (grid.firstChild) return;
    for (var k = 0; k < N; k++) {
      var a = document.createElement('a');
      a.href = '#' + (k + 1);
      a.setAttribute('data-k', k);
      var im = document.createElement('img');
      im.loading = 'lazy'; im.src = 'thumbs/' + pad(k + 1) + '.jpg'; im.alt = alt(k);
      var s = document.createElement('span'); s.textContent = k + 1;
      a.appendChild(im); a.appendChild(s);
      grid.appendChild(a);
    }
  }
  function openGrid() {
    buildGrid(); gridView.hidden = false;
    var on = grid.querySelector('.on'); if (on) on.classList.remove('on');
    var here = grid.children[i]; here.classList.add('on');
    here.scrollIntoView({ block: 'center' }); here.focus();
  }
  function closeGrid() { gridView.hidden = true; document.getElementById('all').focus(); }
  grid.addEventListener('click', function (e) {
    var a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    var k = +a.getAttribute('data-k');
    gridView.hidden = true;
    if (k !== i) show(k, k > i ? 1 : -1);
  });
  document.getElementById('all').onclick = openGrid;
  document.getElementById('closeGrid').onclick = closeGrid;

  // full screen, where the browser allows it
  var fs = document.getElementById('fs');
  if (document.documentElement.requestFullscreen) {
    fs.hidden = false;
    fs.onclick = function () {
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
      else document.documentElement.requestFullscreen().catch(function () { fs.hidden = true; });
    };
    document.addEventListener('fullscreenchange', function () { fs.textContent = document.fullscreenElement ? 'Leave full screen' : 'Full screen'; });
  }
  if (SHOW_PDF) document.getElementById('pdf').hidden = false;

  function fromHash() {
    var n = parseInt((location.hash || '').slice(1), 10);
    return n >= 1 && n <= N ? n - 1 : 0;
  }
  window.addEventListener('hashchange', function () { var k = fromHash(); if (k !== i) show(k, k > i ? 1 : -1); });

  i = fromHash(); show(i, 0);
  fetch('pages.json').then(function (r) { return r.json(); }).then(function (a) {
    alts = a; cur.alt = alt(i);
  }).catch(function () {});
})();
</script>

</body>
</html>
