<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Remembering Micah Bielert</title>
<meta name="description" content="Micah Bielert, June 28, 1986 – March 8, 2025. Remembered by his family.">
<meta property="og:title" content="Remembering Micah Bielert">
<meta property="og:description" content="June 28, 1986 – March 8, 2025. Remembered by his family.">
<meta property="og:image" content="https://micah-bielert.netlify.app/photos/76.jpg">
<meta name="theme-color" content="#1b1a18">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231b1a18'/><text x='50' y='68' font-family='Georgia,serif' font-style='italic' font-size='56' fill='%23ece9e6' text-anchor='middle'>M</text></svg>">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Josefin+Sans:wght@400;600&display=swap">
<style>
  /* Micah's world, taken from his book: a charcoal cover, warm gray pages, a bold italic serif,
     and a geometric sans for small labels. One look, always; it does not follow dark mode. */
  :root {
    --ground: #1b1a18;       /* the charcoal of his book's cover */
    --ground-2: #252320;
    --paper: #ece9e6;        /* his book's pages */
    --ink: #1f1d1a;
    --ink-soft: #3d3934;
    --muted: #6b645a;
    --rule: #c9c2b6;
    --on-dark: #e4dfd7;
    --on-dark-soft: #a39c90;
    --line-dark: #3a3732;
    --focus: #8a6f3e;
    --display: "Playfair Display", "Times New Roman", serif;
    --text: "EB Garamond", Garamond, Georgia, serif;
    --ui: "Josefin Sans", Futura, "Century Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--ground); scroll-padding-top: 64px; }
  body { margin: 0; background: var(--ground); color: var(--on-dark); font-family: var(--text); font-size: 20px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  img, video { max-width: 100%; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  button { font: inherit; color: inherit; }

  /* the opening, on the charcoal */
  .hero { text-align: center; padding: calc(56px + env(safe-area-inset-top, 0px)) 20px 40px; }
  .frame { display: inline-block; padding: 10px; border: 1px solid var(--line-dark); }
  .frame img { display: block; width: min(280px, 64vw); aspect-ratio: 4 / 5; object-fit: cover; filter: grayscale(1) contrast(1.05); }
  .in-memoriam { margin: 0 0 22px; font: 400 13px/1 var(--ui); letter-spacing: 0.32em; text-transform: uppercase; color: var(--on-dark-soft); }
  .name { margin: 30px 0 0; font: italic 500 clamp(40px, 9vw, 68px)/1.05 var(--display); letter-spacing: 0.01em; color: var(--on-dark); text-wrap: balance; }
  .years { margin: 14px 0 0; font: 400 14px/1.4 var(--ui); letter-spacing: 0.22em; text-transform: uppercase; color: var(--on-dark-soft); }
  .tagline { margin: 14px 0 0; font-style: italic; font-size: 22px; color: var(--on-dark-soft); }
  .epigraph { max-width: 30em; margin: 34px auto 0; }
  .epigraph p { margin: 0; font: italic 400 clamp(22px, 3.4vw, 28px)/1.4 var(--display); color: var(--on-dark); text-wrap: balance; }
  .epigraph cite { display: block; margin-top: 10px; font: 400 13px/1.4 var(--ui); font-style: normal; letter-spacing: 0.16em; text-transform: uppercase; color: var(--on-dark-soft); }

  /* the section row */
  .nav {
    position: sticky; top: 0; z-index: 5; display: flex; justify-content: safe center; gap: 0 26px; overflow-x: auto; scrollbar-width: none;
    padding: env(safe-area-inset-top, 0px) 16px 0; background: rgba(27, 26, 24, 0.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line-dark); border-bottom: 1px solid var(--line-dark);
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { flex: none; display: flex; align-items: center; min-height: 52px; text-decoration: none; font: 400 13px/1 var(--ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--on-dark-soft); }
  .nav a:hover { color: var(--on-dark); }

  /* the pages: one long warm gray sheet */
  .sheet { max-width: 940px; margin: 40px auto 0; padding: 8px clamp(20px, 6vw, 76px) 72px; background: var(--paper); color: var(--ink); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.7); }
  section { padding-top: 64px; }
  h2 { margin: 0; text-align: center; font: italic 500 clamp(30px, 5vw, 40px)/1.15 var(--display); color: var(--ink); text-wrap: balance; }
  h2 + .rule { width: 64px; height: 1px; margin: 18px auto 0; background: var(--ink); }
  .intro { max-width: 34em; margin: 18px auto 0; text-align: center; font-style: italic; color: var(--muted); }

  .tribute { max-width: 36em; margin: 48px auto 0; }
  .tribute + .tribute { padding-top: 48px; border-top: 1px solid var(--rule); }
  .t-name { margin: 0; font: italic 500 30px/1.2 var(--display); color: var(--ink); }
  .t-rel { margin: 6px 0 18px; font: 400 13px/1.4 var(--ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .tribute p { margin: 0 0 1em; color: var(--ink-soft); overflow-wrap: anywhere; }
  .tribute p:last-child { margin-bottom: 0; }

  .book { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 36px; align-items: center; margin-top: 40px; }
  .book-cover { display: block; box-shadow: 0 18px 36px -14px rgba(0, 0, 0, 0.55); }
  .book-cover img { display: block; width: 100%; }
  .book h3 { margin: 0; font: italic 500 30px/1.2 var(--display); }
  .book p { margin: 12px 0 0; color: var(--ink-soft); }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 24px; margin-top: 22px; background: var(--ink); color: var(--paper); border: 1px solid var(--ink); text-decoration: none; cursor: pointer; font: 600 13px/1 var(--ui); letter-spacing: 0.16em; text-transform: uppercase; }
  .btn:hover { background: var(--ink-soft); }

  .photos { columns: 3 220px; column-gap: 14px; margin-top: 40px; }
  .ph { display: block; width: 100%; margin: 0 0 14px; padding: 0; border: 0; background: var(--ground-2); cursor: zoom-in; break-inside: avoid; }
  .ph img { display: block; width: 100%; height: auto; }

  .videos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; margin-top: 40px; }
  .video { margin: 0; }
  .video video { display: block; width: 100%; aspect-ratio: 480 / 848; background: var(--ground); object-fit: cover; }
  .video figcaption { margin-top: 8px; font-style: italic; color: var(--muted); }

  .loved { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 30px 20px; margin: 40px auto 0; max-width: 720px; text-align: center; }
  .loved p { margin: 0; }
  .l-name { font: italic 500 24px/1.25 var(--display); color: var(--ink); }
  .l-rel { margin-top: 4px !important; font: 400 12.5px/1.4 var(--ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }

  .foot { padding: 56px 20px calc(56px + env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--on-dark-soft); font-style: italic; }
  .foot a { display: inline-block; margin-top: 10px; font: 400 13px/1 var(--ui); font-style: normal; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; }

  /* a photo, full size */
  .viewer { position: fixed; inset: 0; z-index: 20; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: rgba(12, 11, 10, 0.97); padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  .viewer img { place-self: center; max-width: calc(100vw - 32px); max-height: calc(100% - 32px); object-fit: contain; }
  .viewer-bar { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 10px 16px 16px; }
  .viewer-bar button { min-height: 48px; padding: 0 18px; background: none; border: 1px solid var(--line-dark); color: var(--on-dark); cursor: pointer; font: 600 13px/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; }
  .viewer-bar span { min-width: 72px; text-align: center; font: 400 13px/1 var(--ui); letter-spacing: 0.1em; color: var(--on-dark-soft); font-variant-numeric: tabular-nums; }

  @media (max-width: 640px) {
    body { font-size: 19px; }
    .sheet { margin-top: 24px; }
    .book { grid-template-columns: minmax(0, 1fr); gap: 24px; }
    .photos { columns: 2; column-gap: 10px; }
    .ph { margin-bottom: 10px; }
    .videos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .nav { gap: 0 15px; padding-left: 10px; padding-right: 10px; }
    .nav a { letter-spacing: 0.12em; font-size: 12.5px; }
  }
  @media print {
    html, body, .foot { background: #fff; color: #000; }
    .nav, .btn, .videos, .viewer, #videos { display: none !important; }
    .sheet { box-shadow: none; max-width: none; }
    .frame img { filter: grayscale(1); }
    .hero .name, .hero .epigraph p { color: #000; }
  }
</style>
</head>
<body>

<header class="hero">
  <p class="in-memoriam">In memoriam</p>
  <div class="frame"><img id="portrait" alt="" fetchpriority="high"></div>
  <h1 class="name" id="name"></h1>
  <p class="years" id="years"></p>
  <p class="tagline" id="tagline"></p>
  <blockquote class="epigraph" id="epigraph" hidden><p></p><cite></cite></blockquote>
</header>

<nav class="nav" aria-label="Sections">
  <a href="#tributes">Tributes</a>
  <a href="#book">His book</a>
  <a href="#photos">Photos</a>
  <a href="#videos">Videos</a>
  <a href="#loved">Family</a>
</nav>

<main class="sheet">
  <section id="tributes" aria-labelledby="h-tributes">
    <h2 id="h-tributes">In their words</h2><div class="rule"></div>
    <div id="tribute-list"></div>
  </section>

  <section id="book" aria-labelledby="h-book">
    <h2 id="h-book">His words</h2><div class="rule"></div>
    <div class="book">
      <a class="book-cover" id="book-cover"><img alt="" loading="lazy"></a>
      <div>
        <h3 id="book-title"></h3>
        <p id="book-about"></p>
        <a class="btn" id="book-open">Read his book</a>
      </div>
    </div>
  </section>

  <section id="photos" aria-labelledby="h-photos">
    <h2 id="h-photos">Photographs</h2><div class="rule"></div>
    <div class="photos" id="photo-list"></div>
  </section>

  <section id="videos" aria-labelledby="h-videos">
    <h2 id="h-videos">Videos</h2><div class="rule"></div>
    <div class="videos" id="video-list"></div>
  </section>

  <section id="loved" aria-labelledby="h-loved">
    <h2 id="h-loved">Loved ones</h2><div class="rule"></div>
    <div class="loved" id="loved-list"></div>
  </section>
</main>

<footer class="foot">
  <p id="kept"></p>
  <a href="#">Back to the top</a>
</footer>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Photograph">
  <img id="viewer-img" alt="">
  <div class="viewer-bar">
    <button type="button" id="v-prev">Back</button>
    <span id="v-count"></span>
    <button type="button" id="v-next">Next</button>
    <button type="button" id="v-close">Close</button>
  </div>
</div>

<script src="content.js"></script>
<script>
(function () {
  var M = window.MEMORIAL;
  // Old links to the book used the front page with a page number (#44); send them on to the book.
  if (/^#\d+$/.test(location.hash)) { location.replace('book/' + location.hash); return; }

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function list(names) { return names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0]; }

  // Everything below is set with textContent: the family's words are never read as code.
  $('portrait').src = M.portrait; $('portrait').alt = M.name;
  $('name').textContent = M.name;
  $('years').textContent = M.years;
  $('tagline').textContent = M.tagline;
  if (M.epigraph) {
    var ep = $('epigraph'); ep.hidden = false;
    ep.querySelector('p').textContent = M.epigraph.text;
    ep.querySelector('cite').textContent = M.epigraph.from;
  }
  if (M.keepers && M.keepers.length) $('kept').textContent = 'Kept by ' + list(M.keepers) + ', for the family.';

  M.tributes.forEach(function (t) {
    var a = el('article', 'tribute');
    a.appendChild(el('h3', 't-name', t.name));
    if (t.relation) a.appendChild(el('p', 't-rel', t.relation));
    t.paragraphs.forEach(function (p) { a.appendChild(el('p', null, p)); });
    $('tribute-list').appendChild(a);
  });

  var cover = $('book-cover');
  cover.href = M.book.href; cover.setAttribute('aria-label', 'Read ' + M.book.title);
  cover.querySelector('img').src = M.book.cover;
  $('book-title').textContent = M.book.title;
  $('book-about').textContent = M.book.about;
  $('book-open').href = M.book.href;

  M.photos.forEach(function (p, i) {
    var b = el('button', 'ph'); b.type = 'button'; b.setAttribute('data-i', i);
    b.setAttribute('aria-label', 'Photograph ' + (i + 1) + ' of ' + M.photos.length + ', full size');
    var im = el('img'); im.loading = 'lazy'; im.decoding = 'async'; im.alt = ''; im.width = p.w; im.height = p.h; im.src = p.src;
    b.appendChild(im);
    $('photo-list').appendChild(b);
  });

  M.videos.forEach(function (v) {
    var f = el('figure', 'video');
    var vid = el('video'); vid.controls = true; vid.preload = 'metadata'; vid.setAttribute('playsinline', '');
    vid.src = v.src + '#t=0.1';   // shows the first frame before it plays
    if (v.title) vid.setAttribute('aria-label', v.title);
    f.appendChild(vid);
    if (v.title) f.appendChild(el('figcaption', null, v.title));
    $('video-list').appendChild(f);
  });
  // one video at a time
  document.addEventListener('play', function (e) {
    Array.prototype.forEach.call(document.querySelectorAll('video'), function (v) { if (v !== e.target) v.pause(); });
  }, true);

  M.lovedOnes.forEach(function (p) {
    var d = el('div');
    d.appendChild(el('p', 'l-name', p.name));
    if (p.relation) d.appendChild(el('p', 'l-rel', p.relation));
    $('loved-list').appendChild(d);
  });

  // a photo, full size, with Back and Next, arrows, swipe and Escape
  var viewer = $('viewer'), vImg = $('viewer-img'), at = 0, opener = null;
  function show(i) {
    at = (i + M.photos.length) % M.photos.length;
    vImg.src = M.photos[at].src;
    $('v-count').textContent = (at + 1) + ' / ' + M.photos.length;
  }
  function open(i) { opener = document.activeElement; show(i); viewer.hidden = false; document.body.style.overflow = 'hidden'; $('v-close').focus(); }
  function close() { viewer.hidden = true; document.body.style.overflow = ''; if (opener) opener.focus(); }
  $('photo-list').addEventListener('click', function (e) { var b = e.target.closest('.ph'); if (b) open(+b.getAttribute('data-i')); });
  $('v-prev').addEventListener('click', function () { show(at - 1); });
  $('v-next').addEventListener('click', function () { show(at + 1); });
  $('v-close').addEventListener('click', close);
  viewer.addEventListener('click', function (e) { if (e.target === viewer || e.target === vImg) close(); });
  document.addEventListener('keydown', function (e) {
    if (viewer.hidden) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') show(at + 1);
    else if (e.key === 'ArrowLeft') show(at - 1);
  });
  var sx = null;
  viewer.addEventListener('touchstart', function (e) { sx = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
  viewer.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) show(at + (dx < 0 ? 1 : -1));
  }, { passive: true });
})();
</script>
</body>
</html>
